# OpenPlan — 운영 배포 (D-11 단일 오리진)
#
# 개발용 docker-compose.yml 과 별개 파일이다. 여기엔 postgres 서비스가 없다 — 운영 DB는 RDS다.
#
#   브라우저 :80 → nginx ┬→ /        → ./web (FE 빌드 산출물)
#                        └→ /api/**  → backend:8080 ─(내부망)→ ai:8000
#
# 🔴 ai 는 nginx 에 라우트가 없다 — 브라우저가 AI 서비스를 직접 부르는 경로는 만들지 않는다
#    (Spring↔AI 계약 §2). 내부 네트워크 신뢰가 MVP1 의 인증 모델이다(계약 §7 #4).
#
# 사용:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 전제: 같은 디렉터리에 .env(운영값) · nginx.conf(저장소 원본) · web/(FE dist) 가 있어야 한다.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: openplan-backend:latest
    container_name: openplan-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 🔴 env_file 보다 우선한다(compose 규칙). .env 에 SPRING_PROFILES_ACTIVE=local 이
      # 남아 있어도 여기서 덮어써 운영이 local 로 뜨는 사고를 막는다 — local 프로파일은
      # dev 시드 사용자와 인증 우회 필터(dev-stub)를 켠다.
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # 🔴 이 값이 비어 있으면 AI 접합(AiConfig)이 안 올라가고 규칙 first-fit 이 그대로 돈다.
      #    "AI 를 켰는데 왜 규칙이 도나"의 첫 확인 지점이다. 서비스명은 compose 내부 DNS 로 풀린다.
      AI_BASE_URL: http://openplan-ai:8000
    depends_on:
      # 헬스체크 통과까지 기다린다 — ai 가 뜨는 20초 남짓 동안 들어온 요청이 폴백으로
      # 새는 것을 막는다. ai 가 끝내 못 뜨면 backend 도 안 뜬다는 뜻이므로 required: false 로 둔다.
      openplan-ai:
        condition: service_healthy
        required: false
    expose:
      - "8080"
    # ports 를 두지 않는다. 8080을 호스트에 열면 nginx를 우회해 직접 호출할 수 있고,
    # 그 경로는 X-Forwarded-Proto 가 없어 쿠키 Secure 판정이 어긋난다.
    # 보안그룹이 80만 열려 있어도 이중으로 막아 둔다.

  openplan-ai:
    build:
      # 🔴 AI 는 별도 저장소다. bootstrap.sh 가 ~/openplan-ai 에 클론해 두고 여기서 참조한다 —
      #    BE 이미지에 파이썬을 함께 굽지 않는다(런타임·의존성이 완전히 다르다).
      context: ../openplan-ai
      dockerfile: Dockerfile
    image: openplan-ai:latest
    container_name: openplan-ai
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      # 🔴 모델 키. .env 에 GEMINI_API_KEY 가 없으면 이 서비스는 뜨지만 /plans/draft 가 503 을
      #    돌려주고, Spring 은 계약 §4 대로 규칙 폴백한다 — 기동 실패가 아니라 조용한 폴백이다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COMPLEX_MODEL: ${COMPLEX_MODEL:-gemini/gemini-3.6-flash}
      LIGHT_MODEL: ${LIGHT_MODEL:-gemini/gemini-3.5-flash-lite}
    expose:
      - "8000"
    # ports 를 두지 않는다. 8000 을 호스트에 열면 인증 없이 모델을 호출할 수 있는 구멍이 된다 —
    # 이 서비스에는 인증이 없고(계약 §7 #4 내부망 신뢰), 남의 키로 한도를 태울 수 있다.

  nginx:
    image: nginx:1.27-alpine
    container_name: openplan-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      # nginx.conf 는 server 블록만 담고 있어 conf.d 에 넣어야 한다(파일 주석 참조).
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # FE 빌드 산출물(vite build → dist)을 web/ 으로 복사해 둔다.
      - ./web:/usr/share/nginx/html:ro
    environment:
      TZ: Asia/Seoul

# 네트워크를 명시하지 않으면 compose 가 기본 네트워크를 만든다. nginx.conf 의
# `resolver 127.0.0.11`(Docker 내장 DNS)은 이 사용자 정의 네트워크에서만 동작한다 —
# 그래서 backend 가 죽어도 nginx 는 뜨고 FE 정적 서빙이 계속된다(502만 난다).
