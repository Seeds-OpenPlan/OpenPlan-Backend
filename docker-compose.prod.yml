# OpenPlan — 운영 배포 (D-11 단일 오리진)
#
# 개발용 docker-compose.yml 과 별개 파일이다. 여기엔 postgres 서비스가 없다 — 운영 DB는 RDS다.
#
#   브라우저 :80 → nginx ┬→ /        → ./web (FE 빌드 산출물)
#                        └→ /api/**  → backend:8080
#
# 사용:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 전제: 같은 디렉터리에 .env(운영값) · nginx.conf(저장소 원본) · web/(FE dist) 가 있어야 한다.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: openplan-backend:latest
    container_name: openplan-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 🔴 env_file 보다 우선한다(compose 규칙). .env 에 SPRING_PROFILES_ACTIVE=local 이
      # 남아 있어도 여기서 덮어써 운영이 local 로 뜨는 사고를 막는다 — local 프로파일은
      # dev 시드 사용자와 인증 우회 필터(dev-stub)를 켠다.
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    expose:
      - "8080"
    # ports 를 두지 않는다. 8080을 호스트에 열면 nginx를 우회해 직접 호출할 수 있고,
    # 그 경로는 X-Forwarded-Proto 가 없어 쿠키 Secure 판정이 어긋난다.
    # 보안그룹이 80만 열려 있어도 이중으로 막아 둔다.

  nginx:
    image: nginx:1.27-alpine
    container_name: openplan-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      # nginx.conf 는 server 블록만 담고 있어 conf.d 에 넣어야 한다(파일 주석 참조).
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # FE 빌드 산출물(vite build → dist)을 web/ 으로 복사해 둔다.
      - ./web:/usr/share/nginx/html:ro
    environment:
      TZ: Asia/Seoul

# 네트워크를 명시하지 않으면 compose 가 기본 네트워크를 만든다. nginx.conf 의
# `resolver 127.0.0.11`(Docker 내장 DNS)은 이 사용자 정의 네트워크에서만 동작한다 —
# 그래서 backend 가 죽어도 nginx 는 뜨고 FE 정적 서빙이 계속된다(502만 난다).
