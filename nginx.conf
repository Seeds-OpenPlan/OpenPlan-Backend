# OpenPlan — Nginx 설정 (D-11 단일 오리진)
#
# EC2 1대에서 Nginx 1대가 FE 정적 파일 서빙과 /api 리버스 프록시를 모두 담당한다.
# 브라우저가 보는 오리진이 하나이므로 CORS를 열 필요가 없다 — SecurityConfig의
# "CORS 미개방"은 이 구성을 전제로 한다.
#
#   브라우저 → Nginx ┬→ /        → FE 정적 파일 (Vite build 산출물)
#                    └→ /api/**  → BE 컨테이너 8080
#
# 배치 위치: /etc/nginx/conf.d/default.conf 로 마운트한다. 이 파일은 server 블록만 담고 있어
# 그 자체로 nginx의 최상위 설정(events/http 블록)이 아니다 — 공식 nginx 이미지의 기본
# nginx.conf가 conf.d/*.conf 를 include 하는 구조를 전제로 한다.
#
# ⚠️ 골격이다. FE 화면이 얹힌 뒤 실측 검증이 필요하다(현재 FE src/ 에 라우터 미구성).

server {
    listen 80;
    server_name _;

    # FE 빌드 산출물. Vite 기본 outDir(dist)을 이 경로로 마운트/복사한다.
    root /usr/share/nginx/html;
    index index.html;

    # 업로드·요청 본문 상한. MVP1에 파일 업로드는 없으나 기본값(1m)이 JSON 본문을
    # 조용히 413으로 끊는 사고를 막는 선에서 여유를 둔다.
    client_max_body_size 5m;

    # ── Let's Encrypt 갱신 통로 ──────────────────────────────────────────────
    # certbot 은 http-01 방식으로 이 경로에 파일을 놓고 CA 가 80 포트로 읽어 간다.
    # HTTPS 로 넘어간 뒤에도 **80 을 닫으면 안 되는** 이유가 이것이다 — 90일마다
    # 갱신이 여기로 온다. 아래 HTTPS 설정에서도 이 location 만은 리다이렉트에서 뺀다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ── API 리버스 프록시 ────────────────────────────────────────────────────
    location /api/ {
        # upstream 블록 대신 변수로 프록시한다. upstream(또는 리터럴 호스트)을 쓰면 nginx가
        # **기동 시점에** DNS를 풀고, 못 풀면 "host not found in upstream"으로 아예 뜨지 않는다
        # (실측). 배포에서 BE 컨테이너가 아직 안 떴거나 재시작 중이면 Nginx까지 같이 죽어
        # FE 정적 서빙마저 멈춘다. 변수로 두면 해석이 요청 시점으로 미뤄져 BE만 502가 된다.
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 내장 DNS
        set $openplan_backend "backend:8080";
        # 변수 proxy_pass는 location 프리픽스 치환을 하지 않으므로 $request_uri를 명시한다.
        proxy_pass http://$openplan_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # https 종단 시 BE가 원본 스킴을 알아야 쿠키 Secure 판단·리다이렉트가 맞는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # 인증 쿠키(op_at/op_rt, ADR-0001)는 same-origin이라 별도 처리 없이 전달된다.
        proxy_read_timeout 60s;
    }

    # ── SPA 폴백 ─────────────────────────────────────────────────────────────
    # react-router는 클라이언트 라우팅이라 /dashboard 로 새로고침하면 서버엔 그런 파일이
    # 없다. index.html을 돌려줘야 앱이 뜨고 라우터가 경로를 처리한다. 이게 없으면
    # "새로고침하면 404" 증상이 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 빌드 산출물은 내용이 바뀌면 파일명이 바뀐다 → 장기 캐시 안전.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시하지 않는다 — 배포해도 옛 화면이 남는 사고를 막는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # springdoc(/swagger-ui.html · /v3/api-docs)은 /api 밖이라 여기서 프록시하지 않는다.
    # 운영에 API 문서를 노출할지는 별도 결정 사항이다(노출한다면 접근 제한을 함께 둔다).
}
