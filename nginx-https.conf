# OpenPlan — Nginx 설정 (HTTPS)
#
# 🔴 이 파일은 인증서가 실제로 있을 때만 쓴다. 없으면 nginx 가 기동에 실패한다
#    ("cannot load certificate"). 그래서 발급 전에는 nginx.conf(80 전용)를 쓰고,
#    deploy/enable-https.sh 가 발급에 성공한 뒤 .env 의 NGINX_CONF 를 이 파일로 바꾼다.
#
# 구성은 nginx.conf 와 같다 — 80 은 리다이렉트와 갱신 통로만 맡고, 실제 서빙은 443 이 한다.

server {
    listen 80;
    server_name openplan.services www.openplan.services;

    # 🔴 갱신 통로는 리다이렉트보다 먼저 잡는다. 이걸 443 으로 넘기면 CA 가 인증서 없이
    #    HTTPS 로 접속하려다 실패해 **갱신이 90일 뒤에 조용히 멈춘다.**
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name openplan.services www.openplan.services;

    ssl_certificate     /etc/letsencrypt/live/openplan.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openplan.services/privkey.pem;

    # Let's Encrypt 권장 기본값. 별도 파일로 빼지 않고 여기 둔다 — 설정이 한 파일에 있어야
    # "무엇이 켜져 있나"를 한 번에 읽는다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    # ── API 리버스 프록시 ────────────────────────────────────────────────────
    location /api/ {
        # upstream 블록 대신 변수로 프록시한다. upstream(또는 리터럴 호스트)을 쓰면 nginx가
        # **기동 시점에** DNS를 풀고, 못 풀면 "host not found in upstream"으로 아예 뜨지 않는다
        # (실측). 배포에서 BE 컨테이너가 아직 안 떴거나 재시작 중이면 Nginx까지 같이 죽어
        # FE 정적 서빙마저 멈춘다. 변수로 두면 해석이 요청 시점으로 미뤄져 BE만 502가 된다.
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 내장 DNS
        set $openplan_backend "backend:8080";
        # 변수 proxy_pass는 location 프리픽스 치환을 하지 않으므로 $request_uri를 명시한다.
        proxy_pass http://$openplan_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # https 종단 시 BE가 원본 스킴을 알아야 쿠키 Secure 판단·리다이렉트가 맞는다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # 인증 쿠키(op_at/op_rt, ADR-0001)는 same-origin이라 별도 처리 없이 전달된다.
        proxy_read_timeout 60s;
    }

    # ── SPA 폴백 ─────────────────────────────────────────────────────────────
    # react-router는 클라이언트 라우팅이라 /dashboard 로 새로고침하면 서버엔 그런 파일이
    # 없다. index.html을 돌려줘야 앱이 뜨고 라우터가 경로를 처리한다. 이게 없으면
    # "새로고침하면 404" 증상이 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 빌드 산출물은 내용이 바뀌면 파일명이 바뀐다 → 장기 캐시 안전.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시하지 않는다 — 배포해도 옛 화면이 남는 사고를 막는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # springdoc(/swagger-ui.html · /v3/api-docs)은 /api 밖이라 여기서 프록시하지 않는다.
    # 운영에 API 문서를 노출할지는 별도 결정 사항이다(노출한다면 접근 제한을 함께 둔다).
}
