# 힙 상한 — 기본값이 낮은 환경에서 테스트 워커가 죽는 것을 막는다.
org.gradle.jvmargs=-Xmx2g

# ⚠️ 알려진 환경 제약 (2026-07-18 실측, ST-B1-01b)
#   저장소가 한글 경로(...\OneDrive\바탕 화면\OpenPlan\...) 아래에 있으면
#   `gradlew test`가 ClassNotFoundException으로 **한 건도 실행되지 않는다**.
#   컴파일(compileJava/compileTestJava)은 정상이라 눈에 잘 안 띈다.
#
#   원인: Windows JVM의 sun.jnu.encoding=MS949 + Gradle 테스트 워커의 클래스패스 전달.
#         sun.jnu.encoding은 JVM 기동 후 변경 불가라 -Dfile.encoding=UTF-8로는 해결되지 않는다(실측).
#
#   실측 대조: 동일 커밋을 C:\openplan-testrun(ASCII 경로)로 복사 → BUILD SUCCESSFUL, 5/5 통과.
#   해소: 저장소를 ASCII 경로로 옮긴다(예: C:\dev\openplan). D-02(저장소 구조 정리)와 함께 처리.
