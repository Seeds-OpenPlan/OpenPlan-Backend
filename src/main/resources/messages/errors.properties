validation.name.size=이름은 100자 이하여야 합니다.
validation.dueDate.past=마감일은 오늘 이후여야 합니다.
validation.title.required=제목은 필수입니다.
validation.title.size=제목은 200자 이하여야 합니다.
validation.estimatedMinutes.step=예상 소요 시간은 5분 단위의 0보다 큰 값이어야 합니다.
validation.priority.range=우선순위는 1(높음)·2(보통)·3(낮음) 중 하나여야 합니다.
validation.taskCategoryName.size=이름은 50자 이하여야 합니다.
validation.blockType.invalid=blockType은 TASK 또는 SCHEDULE이어야 합니다.
validation.taskId.required=TASK 블록은 taskId가 필요합니다.
