# =====================================================================================
# 오류 메시지 카탈로그 — 사용자 노출 문구의 **유일한 원본** (exceptions.md §1)
#
# ErrorCode enum은 코드·HTTP 상태만 보유하고 문구는 갖지 않는다. 문구가 두 곳에 있으면
# "단일 grep 감사 지점"이 성립하지 않기 때문이다.
#
# 규약
#  · 키 = ErrorCode.code() 문자열 그대로 (E-COM-001 …). 매핑은 ErrorMessages가 수행.
#  · 값 = 한국어, 사용자에게 그대로 노출 가능. FE는 code로만 분기하고 message는 파싱하지 않는다.
#  · **P4 (AI 표현 금지)**: AI·인공지능·머신러닝·자동 분석 등의 표현을 쓰지 않는다.
#    MVP1의 추천·검증은 전부 규칙 기반이며(A1), 문구가 사실과 달라지면 제품 원칙 위반이다.
#    감사: 이 파일 + 온보딩 콘텐츠 시드에 대한 grep (레인 DoD).
#  · 인코딩 UTF-8. 새 코드 추가 시 ErrorCode enum·openapi.yaml·이 파일을 함께 갱신한다
#    (누락은 ErrorMessageCatalogTest가 빌드에서 잡는다).
# =====================================================================================

# --- 2.1 공통 (E-COM) — 전 라우트 ---
E-COM-001=요청 형식이 올바르지 않습니다.
E-COM-002=로그인이 필요합니다.
E-COM-003=접근 권한이 없습니다.
E-COM-004=요청하신 리소스를 찾을 수 없습니다.
E-COM-005=일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
E-COM-006=다른 곳에서 먼저 저장되어 충돌이 발생했습니다.
E-COM-007=요청이 너무 잦습니다. 잠시 후 다시 시도해 주세요.
E-COM-008=현재 서비스를 이용할 수 없습니다.
E-COM-009=입력한 값의 형식이 올바르지 않습니다.

# --- 2.2 인증·계정 (E-AUTH · E-USER) — BE-1 ---
# E-AUTH-001: 계정 존재 여부를 노출하지 않는다(열거 방지) — "없는 계정"과 문구가 같아야 한다.
E-AUTH-001=이메일 또는 비밀번호가 올바르지 않습니다.
E-AUTH-002=잠금된 계정입니다.
E-AUTH-003=이미 가입된 이메일입니다.
E-AUTH-004=이메일 인증 링크가 만료되었습니다.
E-AUTH-005=이메일 인증이 완료되지 않은 계정입니다.
E-AUTH-006=재설정 링크가 만료되었거나 이미 사용되었습니다.
E-AUTH-007=세션이 만료되었습니다. 다시 로그인해 주세요.
E-AUTH-008=비활성화된 계정입니다.
E-AUTH-009=삭제된 계정입니다.
E-AUTH-010=소셜 로그인에 실패했습니다.
E-AUTH-011=아직 제공되지 않는 기능입니다.
E-USER-001=현재 비밀번호가 올바르지 않습니다.

# --- 2.3 프로젝트·태스크·WBS (E-PROJ · E-WBS) — BE-2 ---
E-PROJ-003=허용되지 않는 상태 전이입니다.
E-PROJ-004=마감일이 지나 재개할 수 없습니다. 마감일을 함께 변경해 주세요.
E-PROJ-005=종료된 프로젝트는 수정할 수 없습니다. 재개 후 수정해 주세요.
E-PROJ-006=마감일이 지난 프로젝트입니다. 편집하려면 마감일을 오늘 이후로 변경해 주세요.
E-WBS-001=종료일이 시작일보다 빠를 수 없습니다.
E-CAT-001=이미 존재하는 카테고리 이름입니다.

# --- 2.4 주간 계획 (E-PLAN) — BE-2 ---
# 주차 중복은 오류 아님(get-or-create) — E-PLAN-001 없음
E-PLAN-002=블록의 시작 시각이 종료 시각보다 늦을 수 없습니다.
E-PLAN-004=차단 항목이 남아 있어 저장할 수 없습니다.

# --- 2.5 외부 연동 (E-EXT) — BE-1 ---
E-EXT-001=외부 서비스 연동에 실패했습니다.
E-EXT-004=이미 연결된 외부 계정입니다.

