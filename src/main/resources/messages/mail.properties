# =====================================================================================
# 메일 문구 카탈로그 — 메일로 나가는 사용자 노출 문구의 **유일한 원본**
#
# errors.properties 와 같은 규율을 받는다. 문구가 코드에 흩어지면 P4 감사의 단일 지점이 무너진다.
#
# 규약
#  · 값은 MessageFormat 로 해석된다 — {0}, {1} 은 치환 인자, 작은따옴표는 '' 로 적을 것.
#  · 줄바꿈은 \n. 본문은 **평문**이다(HTML 아님).
#  · **P4 (AI 표현 금지)**: AI·인공지능·머신러닝·자동 분석 등의 표현을 쓰지 않는다.
#  · 용어는 `OpenPlan문서/00.OpenPlan 용어집 - 시트1.csv` 를 따른다
#    ("회원가입 = 새 계정을 생성하는 인증 절차" — 본문의 "회원가입" 표기 근거).
#  · 링크는 프론트 화면 주소다(op.mail.base-url) — API 주소가 아니다.
#
# 출처: ui-spec·ux-flow-map 에 메일 제목·본문 문구가 없어(화면 문구만 있다) 리드가 초안을 작성하고
#      **2026-08-10 사용자가 원문 그대로 승인**했다. 변경은 같은 절차를 거친다.
# =====================================================================================

# --- 이메일 인증 (AUTH-04) ---
# {0} = 인증 링크 · {1} = 유효 시간(시간 단위)
mail.email-verification.subject=[OpenPlan] 이메일 인증을 완료해 주세요
mail.email-verification.body=OpenPlan 회원가입을 시작하셨습니다.\n\
\n\
아래 주소로 접속하시면 이메일 인증이 완료됩니다.\n\
\n\
{0}\n\
\n\
이 링크는 {1}시간 동안 유효합니다.\n\
본인이 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다.

# --- 비밀번호 재설정 (AUTH-05/06) ---
# {0} = 재설정 링크 · {1} = 유효 시간(시간 단위)
mail.password-reset.subject=[OpenPlan] 비밀번호 재설정 안내
mail.password-reset.body=비밀번호 재설정이 요청되었습니다.\n\
\n\
아래 주소에서 새 비밀번호를 설정하실 수 있습니다.\n\
\n\
{0}\n\
\n\
이 링크는 {1}시간 동안 유효하며 한 번만 사용할 수 있습니다.\n\
본인이 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다. 비밀번호는 변경되지 않습니다.
