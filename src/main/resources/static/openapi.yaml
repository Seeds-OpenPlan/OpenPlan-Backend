openapi: 3.1.0
info:
  title: OpenPlan MVP1 API
  version: 1.0.0
  description: |
    재정합 정본 (US 07-15 기준). 봉투: 성공 {data, meta} / 실패 {error{code,message,details}}.
    오류 코드 전수 목록은 exceptions.md. x-user-stories = US/SS 추적, x-lane = W5 소유 레인.
    인증: httpOnly 쿠키 op_at(JWT access 30m) + op_rt(refresh 14d, Path=/api/v1/auth). ADR-0001.

    ── D-16 인증 구축 순서 (ADR-0010) ──
    인증(authN) 실구현은 4주차. 그 전에는 dev-auth 스텁이 고정 개발 사용자를 주입한다.
    x-auth-phase: WEEK4-STUB = 4주차까지 501 {error.code: E-AUTH-011} 스텁 /
    DEV-STUB-ACTIVE = 스텁 기간에도 dev 사용자 기준으로 동작 (FE 세션 복원 경로 보존).
    본 파일의 인증 요청/응답 스키마는 그 자체로 확정 계약이다 — 4주차 교체 시 계약 변경 0.
    dev 프로파일: devAuth(X-Dev-User 헤더, 생략 시 고정 dev 사용자) / 운영: cookieAuth.
    상세 스텁 계약: api-contracts.md §4.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - devAuth: []   # dev 프로파일 한정 (D-16 dev-auth 스텁). 운영 빌드에서 필터 자체가 미등록

tags:
  - name: auth
  - name: users
  - name: onboarding
  - name: settings
  - name: landing
  - name: external-calendar-connections
  - name: external-calendar-events
  - name: notifications
  - name: support
  - name: announcements
  - name: projects
  - name: tasks
  - name: task-categories
  - name: weekly-plans
  - name: plan-blocks
  - name: schedules
  - name: replan-options
  - name: fixed-schedules
  - name: dashboard
  - name: stats

# ─────────────────────────────────────────────── AUTH (BE-1)
paths:
  /auth/sessions:
    post:
      tags: [auth]
      operationId: login
      summary: 로컬 로그인 (쿠키 발급)
      x-lane: BE-1
      x-user-stories: [AUTH-01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: 로그인 성공. Set-Cookie op_at/op_rt. NFR-001 5초.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: E-AUTH-008 비활성화 계정(재활성화 가능) — details.reactivationTicket, details.recoverableUntil 포함 (ACCT-05)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "410":
          description: E-AUTH-009 삭제된 계정(복구 불가, ACCT-06)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: 세션 확인 (새로고침 시 로그인 상태 복원)
      x-lane: BE-1
      x-user-stories: [AUTH-07]
      responses:
        "200":
          description: 유효 세션
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [auth]
      operationId: logout
      summary: 로그아웃 (세션 폐기 + 쿠키 만료)
      x-lane: BE-1
      x-user-stories: [ACCT-03]
      responses:
        "204": { description: 로그아웃 완료 }
  /auth/token-refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: access 재발급 (refresh 회전 — AUTH-08 세션 만료 복귀)
      x-lane: BE-1
      x-user-stories: [AUTH-07, AUTH-08]
      security: []
      responses:
        "200":
          description: 재발급 성공. Set-Cookie 갱신. data.previousPath = 복귀 경로(NFR-004)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      previousPath: { type: [string, "null"] }
        "401":
          description: E-AUTH-007 refresh 무효/만료 → 재로그인
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /auth/oauth/{provider}:
    get:
      tags: [auth]
      operationId: oauthStart
      summary: 소셜 인가 시작 (302 → 제공자)
      x-lane: BE-1
      x-user-stories: [AUTH-02]
      security: []
      parameters: [{ $ref: "#/components/parameters/OAuthProvider" }]
      responses:
        "302": { description: 제공자 인가 페이지로 리다이렉트 (state 발급) }
  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: 소셜 콜백 — 쿠키 발급 후 302 (쿼리스트링 토큰 전달 금지 — ADR-0001)
      x-lane: BE-1
      x-user-stories: [AUTH-02, ACCT-05]
      security: []
      parameters:
        - { $ref: "#/components/parameters/OAuthProvider" }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: >
            성공 → /dashboard 또는 /onboarding. 비활성화 계정 → /auth/reactivate?ticket=…(1회용).
            실패 → /login?error=E-AUTH-010.
  /auth/reactivations:
    post:
      tags: [auth]
      operationId: reactivateAccount
      x-auth-phase: WEEK4-STUB   # D-16 — 4주차 전 501 E-AUTH-011
      summary: 계정 재활성화 (30일 내 — SC-09)
      x-lane: BE-1
      x-user-stories: [ACCT-05]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 로컬 = credentials / 소셜 = reactivationTicket 중 하나
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
                reactivationTicket: { type: string }
      responses:
        "200":
          description: 재활성화 + 로그인 완료(쿠키 발급). 기존 데이터 보존.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SessionInfo" }
        "410":
          description: E-AUTH-009 30일 경과 — 복구 불가
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /users:
    post:
      tags: [users]
      operationId: signUp
      summary: "회원가입"
      x-lane: BE-1
      x-user-stories: [AUTH-03]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, termsAgreed]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                termsAgreed: { type: boolean }
      responses:
        "201":
          description: 계정 생성 → 이메일 인증 단계 (해시 저장 — NFR-003)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId: { type: string, format: uuid }
                      emailVerificationRequired: { type: boolean }
        "409":
          description: E-AUTH-003 이미 가입된 이메일
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /auth/email-verifications:
    post:
      tags: [auth]
      operationId: sendEmailVerification
      summary: 인증 메일 발송 (재발송 겸용, 429 제한)
      x-lane: BE-1
      x-user-stories: [AUTH-04]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "202": { description: 발송 접수 }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/email-verifications/confirmation:
    post:
      tags: [auth]
      operationId: confirmEmailVerification
      summary: 이메일 인증 완료
      x-lane: BE-1
      x-user-stories: [AUTH-04]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: 인증 완료(멱등 — 기인증도 200) }
        "410":
          description: E-AUTH-004 링크 만료
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /auth/password-resets:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청
      x-lane: BE-1
      x-user-stories: [AUTH-05]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "202": { description: 접수 (존재 여부 무관 동일 응답 — 계정 열거 방지) }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/password-resets/{token}:
    patch:
      tags: [auth]
      operationId: completePasswordReset
      summary: "재설정 완료 (링크 만료 + 1회용 — NFR-005)"
      x-lane: BE-1
      x-user-stories: [AUTH-06]
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newPassword], properties: { newPassword: { type: string, minLength: 8 } } }
      responses:
        "200": { description: 변경 완료 → 로그인 화면 }
        "410":
          description: E-AUTH-006 만료 또는 이미 사용된 링크
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  # ───────────────────────────────────────────── USER / ONBOARDING / SETTINGS (BE-1)
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: 내 계정+프로필
      x-lane: BE-1
      x-user-stories: [ACCT-01]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserProfile" }
    delete:
      tags: [users]
      x-implementation-status: not-implemented
      operationId: deactivateMe
      summary: "[미구현] 계정 비활성화 (30일 복구창 — 이후 배치 삭제, NFR-007)"
      x-lane: BE-1
      x-user-stories: [ACCT-04, ACCT-06]
      responses:
        "200":
          description: 비활성화 + 전 세션 종료. data.recoverableUntil 반환.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recoverableUntil: { type: string, format: date-time }
  /users/me/profile:
    patch:
      tags: [users]
      operationId: updateProfile
      summary: 프로필 수정
      x-lane: BE-1
      x-user-stories: [ONB-02, ACCT-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                purpose: { type: string, maxLength: 100 }
                timezone: { type: string, examples: [Asia/Seoul] }
                weekStartDay: { $ref: "#/components/schemas/Weekday" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserProfile" }
  /users/me/password:
    patch:
      tags: [users]
      x-implementation-status: not-implemented
      operationId: changePassword
      summary: "[미구현] 비밀번호 변경"
      x-lane: BE-1
      x-user-stories: [ACCT-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200": { description: 변경 완료 }
        "400": { description: E-USER-001 현재 비밀번호 불일치, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /users/me/onboarding-progress:
    get:
      tags: [users]
      operationId: getOnboardingProgress
      summary: 온보딩·튜토리얼 진행 상태
      x-lane: BE-1
      x-user-stories: [ONB-01, TUT-08]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OnboardingProgress" }
    patch:
      tags: [users]
      operationId: updateOnboardingProgress
      summary: 단계 완료/건너뛰기 · 튜토리얼 재실행(tutorialDone=false 리셋 — TUT-09)
      x-lane: BE-1
      x-user-stories: [ONB-01, ONB-02, ONB-04, ONB-06, ONB-07, TUT-08, TUT-09]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingProgress" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OnboardingProgress" }
  /onboarding/contents:
    get:
      tags: [onboarding]
      operationId: getOnboardingContents
      summary: 소개·안내 콘텐츠 (2장 — SC-05/SC-11 교정 문구, 규칙 기반 검증 중심 명칭)
      x-lane: BE-1
      x-user-stories: [ONB-01, ONB-03, ONB-05, TUT-02]
      parameters:
        - { name: step, in: query, required: true, schema: { type: string, enum: [INTRO, AVAILABILITY_GUIDE, FIXED_SCHEDULE_GUIDE, TUTORIAL] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        order: { type: integer }
                        title: { type: string }
                        body: { type: string }
                        imageUrl: { type: [string, "null"] }
  /users/me/availabilities:
    get:
      tags: [users]
      operationId: getAvailabilities
      summary: 가용 시간 조회 (요일 7행 + 주간 총합)
      x-lane: BE-1
      x-user-stories: [FIX-01, ONB-04]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AvailabilityView" }
    put:
      tags: [users]
      operationId: saveAvailabilities
      summary: 가용 시간 전체 저장 (공통 패턴 일괄 적용은 FE가 7행 확장 — 5분 단위)
      x-lane: BE-1
      x-user-stories: [ONB-04, FIX-02, FIX-03, PLAN-32]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patterns]
              properties:
                patterns:
                  type: array
                  minItems: 7
                  maxItems: 7
                  items: { $ref: "#/components/schemas/AvailabilityPattern" }
      responses:
        "200":
          description: 저장 + 주간 총합 재계산
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AvailabilityView" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /users/me/preferences:
    get:
      tags: [users]
      x-implementation-status: not-implemented
      operationId: getPreferences
      summary: "[미구현] 사용자 기본 설정 조회"
      x-lane: BE-1
      x-user-stories: [FIX-10]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Preferences" }
    put:
      tags: [users]
      x-implementation-status: not-implemented
      operationId: savePreferences
      summary: "[미구현] 기본 설정 저장 (예상 시간 기본값 5분 단위 · 재계획 대안 기본값)"
      x-lane: BE-1
      x-user-stories: [FIX-11, FIX-12]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Preferences" }
  /users/me/preference-suggestions:
    get:
      tags: [users]
      x-implementation-status: not-implemented
      operationId: getPreferenceSuggestions
      summary: "[미구현] 규칙 기반 기본값 제안 (SS-14 — 제안만, 적용은 사용자 PUT — C-2)"
      x-lane: BE-1
      x-user-stories: [RB-FIX-01]
      responses:
        "200":
          description: 이력 부족 시 data=null (오류 아님)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - { $ref: "#/components/schemas/PreferenceSuggestion" }
                      - { type: "null" }
  /settings:
    get:
      tags: [settings]
      x-implementation-status: not-implemented
      operationId: getSettingsHome
      summary: "[미구현] 설정 홈 조립 응답 (D-12 레버 5)"
      x-lane: BE-1
      x-user-stories: [FIX-01, FIX-10, FIX-13, NOTI-01]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      availability: { $ref: "#/components/schemas/AvailabilityView" }
                      preferences: { $ref: "#/components/schemas/Preferences" }
                      connections:
                        type: array
                        items: { $ref: "#/components/schemas/ExternalConnection" }
                      notificationSettings:
                        type: array
                        items: { $ref: "#/components/schemas/NotificationSetting" }
  /landing:
    get:
      tags: [landing]
      operationId: getLanding
      summary: "랜딩 콘텐츠 (비인증)"
      x-lane: BE-1
      x-user-stories: [LANDING]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sections: { type: array, items: { type: object } }

  # ───────────────────────────────────────────── EXTERNAL CALENDAR (BE-1)
  /external-calendar-connections:
    get:
      tags: [external-calendar-connections]
      operationId: listConnections
      summary: "연동 목록·상태"
      x-lane: BE-1
      x-user-stories: [FIX-13]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalConnection" }
    post:
      tags: [external-calendar-connections]
      operationId: createConnection
      summary: "연동 추가 (구글·카카오는 authCode 교환, 네이버는 CalDAV 자격증명)"
      description: |
        제공자에 따라 인증 모델이 다르다. 하나의 요청으로 합친 것은 편의가 아니라, 연동 목록·해제·
        캘린더 선택이 전부 제공자와 무관하게 같은 자원을 쓰기 때문이다.

        구글·카카오: startCalendarAuthorization 이 302로 보낸 인가가 끝나면 제공자가 redirectUri 로
        code 와 state 를 돌려준다. 그 둘을 그대로 싣는다.

        네이버: 캘린더 오픈 API 에 조회 계열 엔드포인트가 없어(공식 저장소 전수 확인, 2026-08-19)
        OAuth 로는 일정을 읽을 수 없다. 대신 CalDAV(caldav.calendar.naver.com, Basic 인증)가
        열려 있어 그 경로로 붙는다. 그래서 네이버는 authCode 가 아니라 네이버 ID 와 2단계 인증
        애플리케이션 비밀번호를 싣는다.

        네이버가 startCalendarAuthorization 의 provider 목록에 없는 것은 누락이 아니다 — 인가 단계
        자체가 없다. 애플리케이션 비밀번호는 사용자가 네이버 보안설정에서 직접 발급하며, 일반
        로그인 비밀번호로는 CalDAV 가 인증되지 않는다.
      x-lane: BE-1
      x-user-stories: [ONB-07, FIX-14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OAuthCalendarConnectionRequest"
                - $ref: "#/components/schemas/NaverCalendarConnectionRequest"
              discriminator:
                propertyName: provider
                mapping:
                  GOOGLE: "#/components/schemas/OAuthCalendarConnectionRequest"
                  KAKAO: "#/components/schemas/OAuthCalendarConnectionRequest"
                  NAVER: "#/components/schemas/NaverCalendarConnectionRequest"
      responses:
        "201":
          description: 연결 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ExternalConnection" }
        "409": { description: E-EXT-004 이미 연결된 계정, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "422": { description: "E-EXT-002 제공자가 자격증명을 거부 (네이버 — ID·애플리케이션 비밀번호 오류). 사용자가 고칠 수 있는 입력 오류라 502 와 구분한다", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: E-EXT-001 제공자 오류, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
