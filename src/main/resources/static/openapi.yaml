  /external-calendar-authorization:
    get:
      tags: [external-calendar-connections]
      operationId: startCalendarAuthorization
      summary: "캘린더 연동 인가 시작 (302 → 제공자)"
      description: |
        캘린더 연동에 쓸 인가 코드를 받기 위해 제공자 인가 페이지로 보낸다. 로그인 인가(oauthStart)와
        다른 요청이다 — 요구하는 권한과 파라미터가 다르다.

        서버가 조립하는 이유: 구글은 access_type=offline 없이는 refresh 토큰을 주지 않는다. 그것이
        없으면 access 토큰이 만료되는 순간(약 1시간) 연동이 영구히 죽고 재연동 외 복구 수단이 없다.
        게다가 재연동해도 두 번째부터는 prompt=consent 없이 refresh 토큰을 주지 않아 같은 일이
        반복된다. 이 두 파라미터를 클라이언트가 기억하게 두면 언젠가 빠진다.

        서버가 싣는 것: 캘린더 읽기 scope · access_type=offline · prompt=consent · 서명된 state.
      x-lane: BE-1
      x-user-stories: [ONB-07, FIX-14]
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [GOOGLE, KAKAO] } }
        - name: redirectUri
          in: query
          required: true
          description: 제공자가 code·state 를 돌려줄 화면 주소. 제공자 콘솔에 등록된 값이어야 한다.
          schema: { type: string }
      responses:
        "302": { description: 제공자 인가 페이지로 리다이렉트 (state 발급) }
        "422": { description: E-COM-009 지원하지 않는 제공자·허용되지 않은 redirectUri, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /external-calendar-events/{eventId}/application:
    post:
      tags: [external-calendar-events]
      operationId: applyExternalEvent
      summary: "반영 방식 적용 — AS_IS/EDITED → 고정 일정(source=EXTERNAL) 생성, EXCLUDE → 제외 (ONB-09)"
      x-lane: BE-1
      x-user-stories: [ONB-09]
      parameters: [{ name: eventId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [AS_IS, EDITED, EXCLUDE] }
                edited:
                  type: object
                  description: mode=EDITED일 때 고정 일정 필드 재정의
                  properties:
                    title: { type: string }
                    weekday: { $ref: "#/components/schemas/Weekday" }
                    startTime: { type: string, format: time }
                    endTime: { type: string, format: time }
      responses:
        "201":
          description: 반영 결과 (EXCLUDE는 fixedSchedule=null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      applyStatus: { type: string, enum: [APPLIED, EXCLUDED] }
                      fixedSchedule:
                        oneOf:
                          - { $ref: "#/components/schemas/FixedSchedule" }
                          - { type: "null" }

