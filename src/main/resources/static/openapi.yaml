# ───────────────────────────────────────────────────────────── components
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: op_at
      description: 운영 모드 — httpOnly JWT access 쿠키 (ADR-0001). 4주차부터 활성.
    devAuth:
      type: apiKey
      in: header
      name: X-Dev-User
      description: |
        dev-auth 스텁 (D-16, ADR-0010). dev 프로파일에서만 필터 등록.
        헤더 생략 시 고정 dev 사용자(00000000-0000-0000-0000-000000000001)로 인증된 것으로 간주.
        시드된 다른 테스트 사용자 UUID를 넣으면 그 사용자로 동작 (NFR-030 사용자 격리 테스트용).
        미시드 UUID → 401 E-COM-002. 운영 프로파일에는 이 필터가 존재하지 않는다.
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
    OAuthProvider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, naver, kakao] } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    BlockId: { name: blockId, in: path, required: true, schema: { type: string, format: uuid } }
    ConnectionId: { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    FixedScheduleId: { name: fixedScheduleId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest:
      description: E-COM-001 요청 형식 오류 — details.fields[]
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: E-COM-002 인증 필요 (NFR-004) / E-AUTH-001 자격 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: E-COM-004 리소스 없음 (타인 리소스 은닉 포함)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    VersionConflict:
      description: E-COM-006 저장 충돌 (SYS-05) — details.latest에 최신본 동봉 (3택 UI 재료)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UnprocessableEntity:
      description: E-COM-009 값 의미 오류 (5분 단위·시간 역전 등)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    TooManyRequests:
      description: E-COM-007 요청 횟수 초과
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, pattern: "^E-[A-Z]+-[0-9]{3}$" }
            message: { type: string, description: "사용자 표시 가능 문구 (P4 준수)" }
            details: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    Weekday: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] }
    SessionInfo:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: [string, "null"] }
        email: { type: string }
        onboardingCompleted: { type: boolean }
        weekStartDay: { $ref: "#/components/schemas/Weekday" }
        timezone: { type: string }
    UserProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        loginType: { type: string, enum: [LOCAL, SOCIAL] }
        socialProvider: { type: [string, "null"], enum: [GOOGLE, NAVER, KAKAO, null] }
        name: { type: string }
        purpose: { type: [string, "null"] }
        timezone: { type: string }
        weekStartDay: { $ref: "#/components/schemas/Weekday" }
    OnboardingProgress:
      type: object
      properties:
        introDone: { type: boolean }
        profileDone: { type: boolean }
        availabilityDone: { type: boolean }
        fixedScheduleDone: { type: boolean }
        tutorialDone: { type: boolean }
        calendarSyncDone: { type: boolean }
        tutorialSampleProjectId: { type: [string, "null"], format: uuid, description: "잔존 튜토리얼 샘플 프로젝트 (TUT-09 재실행 확인 다이얼로그 재료 — GAP-1/B13. 삭제 시 서버가 null 처리)" }
    AvailabilityPattern:
      type: object
      required: [weekday, startTime, endTime, isActive]
      properties:
        weekday: { $ref: "#/components/schemas/Weekday" }
        startTime: { type: string, format: time, description: "5분 단위" }
        endTime: { type: string, format: time }
        isActive: { type: boolean }
    AvailabilityView:
      type: object
      properties:
        patterns:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityPattern" }
        weeklyTotalMinutes: { type: integer, description: "파생 계산 — FIX-01 주간 총 가용시간 (컬럼 아님, doc-consistency §3 간극4 판정)" }
    Preferences:
      type: object
      properties:
        defaultEstimatedMinutes: { type: [integer, "null"], multipleOf: 5, minimum: 5 }
        defaultReplanStrategy: { type: [string, "null"], enum: [KEEP_CURRENT, MINIMAL_CHANGE, DEADLINE_FIRST, WORKLOAD_BALANCE, null] }
    PreferenceSuggestion:
      type: object
      description: SS-14 출력 — 제안값 + 규칙 근거 (C-3)
      properties:
        suggestedEstimatedMinutes: { type: [integer, "null"], multipleOf: 5 }
        suggestedReplanStrategy: { type: [string, "null"] }
        suggestedAvailabilities:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityPattern" }
        reason: { type: string, description: "예: '최근 4주 실제 시간 중앙값 기준' — AI 표현 금지 (P4)" }
    OAuthCalendarConnectionRequest:
      type: object
      description: "구글·카카오 — startCalendarAuthorization 인가 결과를 교환한다."
      required: [provider, authCode, redirectUri, state]
      properties:
        provider: { type: string, enum: [GOOGLE, KAKAO] }
        authCode: { type: string }
        redirectUri:
          type: string
          description: |
            제공자가 인가 때 쓴 값과 대조한다 — 한 글자만 달라도 교환이 거부된다. 형식이 아니라
            검증 대상이다.
        state: { type: string, description: "startCalendarAuthorization 이 발급한 값 그대로" }
    NaverCalendarConnectionRequest:
      type: object
      description: |
        네이버 — CalDAV Basic 자격증명. authCode·state 가 없는 것은 인가 단계가 없기 때문이다.
      required: [provider, naverId, appPassword]
      properties:
        provider: { type: string, enum: [NAVER] }
        naverId:
          type: string
          description: "네이버 아이디. 이메일 전체가 아니라 @ 앞부분이다."
        appPassword:
          type: string
          format: password
          description: |
            네이버 보안설정 > 2단계 인증 > 애플리케이션 비밀번호에서 발급한 값. 일반 로그인
            비밀번호로는 CalDAV 가 인증되지 않는다. 서버는 이 값을 암호화해 보관하며 응답에 싣지
            않는다.
    ExternalConnection:
      type: object
      properties:
        connectionId: { type: string, format: uuid }
        provider: { type: string }
        accountIdentifier: { type: string }
        syncMode: { type: string }
        status: { type: string, enum: [CONNECTED, DISABLED] }
        connectedAt: { type: string, format: date-time }
        selectedCalendars:
          type: array
          items:
            type: object
            properties:
              externalCalendarId: { type: string }
              name: { type: string }
    ExternalEvent:
      type: object
      properties:
        externalCalendarEventId: { type: string, format: uuid }
        title: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        sourceCalendar: { type: string }
        applyStatus: { type: string, enum: [CANDIDATE, APPLIED, EXCLUDED] }
    NotificationSetting:
      type: object
      required: [notificationType, isEnabled]
      properties:
        notificationType: { type: string, enum: [DEADLINE_SOON, TODAY_TASKS, PLAN_UNSAVED, RETROSPECT, SUPPORT_ANSWERED] }
        isEnabled: { type: boolean }
    Notification:
      type: object
      properties:
        notificationId: { type: string, format: uuid }
        notificationType: { type: string }
        title: { type: string }
        routePath: { type: string, description: "NOTI-04 이동 경로. SUPPORT_ANSWERED는 본인 문의 상세만 (NFR-030)" }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        supportTicketId: { type: string, format: uuid }
        category: { type: string }
        title: { type: string }
        content: { type: string }
        status: { type: string, enum: [RECEIVED, IN_PROGRESS, ANSWERED, CLOSED] }
        hasAnswer: { type: boolean, description: "HELP-02 답변 유무 시각 표시 (텍스트 병기 — NFR-017)" }
        answerContent: { type: [string, "null"] }
        answeredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    HelpArticle:
      type: object
      properties:
        helpArticleId: { type: string, format: uuid }
        category: { type: string }
        title: { type: string }
        content: { type: string }
    Announcement:
      type: object
      properties:
        announcementId: { type: string, format: uuid }
        announcementType: { type: string, enum: [MAINTENANCE, INCIDENT, CHANGE], description: "OPS-01 목록 유형 Badge" }
        title: { type: string }
        content: { type: string }
        publishedStartAt: { type: string, format: date-time }
    ProjectSummary:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string }
        dueDate: { type: [string, "null"], format: date }
        status: { type: string, enum: [IN_PROGRESS, PAUSED, CLOSED] }
        priority: { type: [integer, "null"], deprecated: true, description: "미사용 — 프로젝트 우선순위는 요구사항에 없다(FR-141·148). 항상 null. 코드 정리 후 삭제 예정" }
        badges:
          type: object
          x-implementation-status: not-implemented
          description: "[미구현] PROJ-01/04 배지 — 응답에 아직 없음. FE는 부재 시 0으로 폴백하므로 배지가 전부 0으로 보인다(조용한 실패). 텍스트 병기 (NFR-017)"
          properties:
            unassignedCount: { type: integer }
            assignedCount: { type: integer }
            deadlineSoon: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    Project:
      allOf:
        - { $ref: "#/components/schemas/ProjectSummary" }
        - type: object
          properties:
            description: { type: string }
            closedAt: { type: [string, "null"], format: date-time }
            taskStats:
              type: object
              x-implementation-status: not-implemented
              description: "[미구현] PROJ-04 태스크 상태별 개수 — 응답에 아직 없음. FE는 부재 시 0으로 폴백"
              properties:
                total: { type: integer }
                unassigned: { type: integer }
                inProgress: { type: integer }
                completed: { type: integer }
    TaskInput:
      type: object
      required: [title, estimatedMinutes]
      properties:
        title: { type: string, maxLength: 200 }
        memo: { type: string }
        estimatedMinutes: { type: integer, multipleOf: 5, minimum: 5 }
        priority: { type: [integer, "null"], minimum: 1, maximum: 3 }
        dueDate: { type: [string, "null"], format: date }
        categoryId: { type: [string, "null"], format: uuid, description: "SC-01 — null = '없음'" }
    Task:
      description: >-
        태스크 응답 (상세·목록 항목·쓰기 공용). 카테고리·프로젝트의 **이름은 내려가지 않는다** —
        categoryId·projectId만 있으므로, 표시명은 FE가 GET /task-categories·프로젝트 목록을 받아
        클라이언트에서 조인한다 (ADR-0012 ④).
      allOf:
        - { $ref: "#/components/schemas/TaskInput" }
        - type: object
          properties:
            taskId: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            status: { type: string, enum: [UNASSIGNED, IN_PROGRESS, COMPLETED] }
            wbsRange:
              type: [object, "null"]
              x-implementation-status: not-implemented
              description: "[미구현] ST-B2-05 WBS 기간 — 응답에 아직 없음. FE는 부재 시 null로 폴백"
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
    UnassignedTask:
      description: >-
        미배치 패널 전용 응답 — Task 전 필드 + projectName. 구현(UnassignedTaskResponse)이
        @JsonUnwrapped로 평탄화하므로 중첩 없이 Task 필드와 같은 레벨에 온다.
      allOf:
        - { $ref: "#/components/schemas/Task" }
        - type: object
          properties:
            projectName: { type: string }
    TaskCategory:
      description: >-
        사용자별 카테고리 프리셋. (userId, name) UNIQUE라 같은 이름은 사용자 안에서만 유일하다.
        updatedAt·version은 스키마에 없으므로 응답에도 없다.
      type: object
      properties:
        taskCategoryId: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        sortOrder: { type: integer, description: "정렬 우선순위. 재정렬 엔드포인트가 없어 현재는 항상 0" }
        createdAt: { type: string, format: date-time }
    WbsItem:
      type: object
      properties:
        wbsItemId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    StructuringDraft:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        title: { type: string }
        proposedEstimatedMinutes: { type: [integer, "null"] }
        proposedPriority: { type: [integer, "null"] }
        reason: { type: string, description: "매칭된 규칙 사전 항목 (C-3)" }
    Schedule:
      type: object
      properties:
        scheduleId: { type: string, format: uuid }
        title: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        estimatedMinutes: { type: [integer, "null"] }
        priority: { type: [integer, "null"], minimum: 1, maximum: 3 }
        memo: { type: [string, "null"] }
        version: { type: integer, format: int64 }
    FixedScheduleInput:
      type: object
      required: [title, weekday, startTime, endTime]
      properties:
        title: { type: string, maxLength: 255 }
        weekday: { $ref: "#/components/schemas/Weekday" }
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
    FixedSchedule:
      allOf:
        - { $ref: "#/components/schemas/FixedScheduleInput" }
        - type: object
          properties:
            fixedScheduleId: { type: string, format: uuid }
            source: { type: string, enum: [MANUAL, EXTERNAL] }
            status: { type: string, enum: [ACTIVE, INACTIVE], description: "서버 관리 — EXTERNAL 유래의 연동 활성 상태 미러(FIX-16). MANUAL은 항상 ACTIVE. PLAN-33/34 주차 한정 제외는 week-exceptions 리소스 (이 필드 아님)" }
            version: { type: integer, format: int64 }
    WeeklyPlan:
      type: object
      properties:
        weeklyPlanId: { type: string, format: uuid }
        weekStartDate: { type: string, format: date }
        weekEndDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        totalPlannedMinutes: { type: integer }
        confirmedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
    PlanBlockInput:
      type: object
      required: [blockType, startAt, endAt]
      properties:
        blockType: { type: string, enum: [TASK, SCHEDULE] }
        taskId: { type: [string, "null"], format: uuid, description: "TASK 필수" }
        schedule:
          type: [object, "null"]
          description: SCHEDULE 필수 — 일정 인라인 생성 (PLAN-08)
          properties:
            title: { type: string }
            estimatedMinutes: { type: [integer, "null"], multipleOf: 5 }
            priority: { type: [integer, "null"], minimum: 1, maximum: 3 }
            memo: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    PlanBlock:
      type: object
      properties:
        planBlockId: { type: string, format: uuid }
        weeklyPlanId: { type: string, format: uuid }
        blockType: { type: string, enum: [TASK, SCHEDULE] }
        taskId: { type: [string, "null"], format: uuid }
        scheduleId: { type: [string, "null"], format: uuid }
        title: { type: string, description: "task/schedule 제목 조인 파생 (plan_blocks.title 컬럼 삭제 — data-model §2.2)" }
        projectId: { type: [string, "null"], format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, COMPLETED] }
    WeeklyPlanView:
      type: object
      description: 주간 화면 조립 (PLAN-01/04/05/21 한 번에 — NFR-011/024)
      properties:
        plan:
          oneOf:
            - { $ref: "#/components/schemas/WeeklyPlan" }
            - { type: "null" }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/PlanBlock" }
        fixedSchedules:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/FixedSchedule" }
              - type: object
                properties:
                  activeThisWeek: { type: boolean, description: "false = 이 주 배치 제약 미적용 (주차 예외 PLAN-33 또는 INACTIVE) — 고스트 표시 + 재활성화 액션 (PLAN-34)" }
        availability: { $ref: "#/components/schemas/AvailabilityView" }
        summary:
          type: object
          description: PLAN-01 — 가용·사용·여유·배치 수
          properties:
            availableMinutes: { type: integer }
            plannedMinutes: { type: integer }
            freeMinutes: { type: integer }
            placedTaskCount: { type: integer }
        unassignedCount: { type: integer }
        validationSummary:
          type: object
          description: PLAN-21 개수 배지
          properties:
            blockCount: { type: integer }
            warningCount: { type: integer }
    ValidationIssue:
      type: object
      description: SS-06 출력 항목 = validation_issues 스키마 (C-3 사유 동반)
      required: [ruleId, severity, reason]
      properties:
        validationIssueId: { type: [string, "null"], format: uuid, description: "dry-run은 null (무영속)" }
        ruleId: { type: string, enum: [V1_OVERLAP, V2_FIXED_CONFLICT, V3_CAPACITY_EXCEEDED, V4_OUT_OF_AVAILABILITY, V5_OUT_OF_WBS, V6_AFTER_DUE_DATE, V7_BUFFER_SHORTAGE] }
        severity: { type: string, enum: [BLOCK, WARNING] }
        planBlockId: { type: [string, "null"], format: uuid, description: "쌍 규칙(V1·V2)에서는 쌍 중 UUID 오름차순 첫 블록 (ADR-0013)" }
        counterpartId: { type: [string, "null"], format: uuid, description: "쌍 규칙의 상대 엔티티 — V1: 상대 plan_block(UUID 큰 쪽), V2: fixed_schedule. 그 외 규칙은 null. (planBlockId, counterpartId) 조합이 쌍을 유일 식별한다 (ADR-0013)" }
        taskId: { type: [string, "null"], format: uuid }
        weekday: { type: [string, "null"], description: "V3/V4 요일 수준 이슈" }
        reason: { type: string, description: "규칙 근거 문구 — '규칙 N에 의해' (P4)" }
        resolutionStatus: { type: string, enum: [OPEN, RESOLVED] }
    ValidationReport:
      type: object
      properties:
        dryRun: { type: boolean }
        savable: { type: boolean, description: "차단 0건 여부 (PLAN-28)" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }
        evaluatedAt: { type: string, format: date-time, description: "판정에 사용된 기준 시각 (입력 파라미터 — C-1)" }
    PlacementProposal:
      type: object
      description: SS-05 출력 — 저장되지 않은 초안 (C-2)
      properties:
        proposedBlocks:
          type: array
          items: { $ref: "#/components/schemas/PlanBlockInput" }
        unplacedTaskIds:
          type: array
          description: 가용 슬롯 부족으로 배치 못 한 태스크
          items: { type: string, format: uuid }
        reason: { type: string, description: "정렬 규칙 설명 (우선순위→마감일→예상시간, first-fit)" }
    ReplanOption:
      type: object
      properties:
        replanOptionId: { type: [string, "null"], format: uuid, description: "KEEP_CURRENT 기준선은 null (행 미생성)" }
        strategyType: { type: string, enum: [KEEP_CURRENT, MINIMAL_CHANGE, DEADLINE_FIRST, WORKLOAD_BALANCE] }
        changeSummary: { type: string }
        recommendationReason: { type: [string, "null"], description: "규칙 근거 (C-3, P4 준수)" }
        score: { type: [number, "null"] }
        proposedBlocks:
          type: array
          items: { $ref: "#/components/schemas/PlanBlockInput" }
        isSelected: { type: boolean }
    ExecutionLog:
      type: object
      properties:
        executionLogId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        actualMinutes: { type: integer }
        result: { type: string, enum: [COMPLETED, DELAYED, ABORTED] }
        memo: { type: [string, "null"] }
    DashboardView:
      type: object
      description: 대시보드 단일 조립 (D-12 레버 5)
      properties:
        statusBoard:
          type: object
          description: DASH-01 — 과부하/여유 판단
          properties:
            weekStartDate: { type: string, format: date }
            plannedMinutes: { type: integer }
            availableMinutes: { type: integer }
            deltaMinutes: { type: integer, description: "양수=여유, 음수=초과 — 텍스트 병기 (NFR-017)" }
        priorityAction:
          type: [object, "null"]
          description: RB-DASH-01/SS-01 — 최상위 1행동 (전순서 Q3, W3 확정)
          properties:
            actionType: { type: string, enum: [RESOLVE_FIXED_CONFLICT, PLACE_UNASSIGNED, REPLACE_TODAY_INCOMPLETE, FIX_OUT_OF_WBS, RESOLVE_CAPACITY, HANDLE_DEADLINE] }
            reason: { type: string }
            routePath: { type: string }
        riskIssues:
          type: array
          description: DASH-03/04 — 위험 목록 + 해결 이동
          items:
            type: object
            properties:
              riskType: { type: string, enum: [UNASSIGNED_TASKS, OUT_OF_WBS, FIXED_CONFLICT, DEADLINE_SOON] }
              count: { type: integer }
              description: { type: string }
              routePath: { type: string }
        todayBoard:
          type: object
          description: DASH-05 + RB-DASH-02/SS-02
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  planBlockId: { type: string, format: uuid }
                  taskId: { type: [string, "null"], format: uuid }
                  title: { type: string }
                  startAt: { type: string, format: date-time }
                  endAt: { type: string, format: date-time }
                  estimatedMinutes: { type: [integer, "null"] }
                  completed: { type: boolean }
                  selectionRank: { type: [integer, "null"], description: "SS-02 선정 순위 (규칙 정렬)" }
            remainingMinutes: { type: integer }
        weeklyImpactProjects:
          type: array
          description: DASH-06
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              name: { type: string }
              impactBadges: { type: array, items: { type: string, enum: [DEADLINE_SOON, HAS_UNASSIGNED, ACTUAL_OVERRUN] } }
        busyWeekdays:
          type: array
          description: DASH-07 — 손 볼 요일 % (P1 결정적, 텍스트 병기)
          items:
            type: object
            properties:
              weekday: { $ref: "#/components/schemas/Weekday" }
              remainingAvailabilityPercent: { type: number }
    StatsSummary:
      type: object
      properties:
        period: { type: string, enum: [WEEKLY, MONTHLY] }
        rangeStart: { type: string, format: date }
        rangeEnd: { type: string, format: date }
        totalEstimatedMinutes: { type: integer }
        totalActualMinutes: { type: integer }
        completionRate: { type: [number, "null"] }
        varianceRate: { type: [number, "null"] }
