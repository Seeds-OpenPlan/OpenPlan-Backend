spring:
  application:
    name: openplan-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openplan}
    username: ${DB_USERNAME:openplan}
    password: ${DB_PASSWORD:openplan1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ADR-0002: 스키마 정본은 Flyway. Hibernate는 검증만 하고 스키마를 손대지 않는다
      # (update는 스키마 분기를 만든다 — charter R3).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # ADR-0002 · ST-B1-01 AC2 — 기본값은 **운영 기준(안전한 쪽)**: dev 시드 경로를 포함하지 않는다.
  # 설정이 누락됐을 때의 결과가 "시드 유출"이 아니라 "시드 부재"가 되도록 방향을 잡았다.
  # local 프로파일에서만 아래에서 열어준다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # 메일 발송 (ST-B1-04/05 — 이메일 인증·비밀번호 재설정). dev는 Gmail 앱 비밀번호,
  # 운영은 AWS SES(프로덕션 액세스 승인 필요) — 호스트·자격증명만 바뀐다.
  # 자격증명이 비어 있으면 실제 발송 대신 로그로 남긴다(MailConfig) — 팀원 로컬 보존(D-32).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

springdoc:
  swagger-ui:
    # 진입 경로. `/swagger-ui/index.html`로 두면 springdoc이 여기에 UI 리소스 경로를 한 번 더
    # 붙여 `/swagger-ui/swagger-ui/index.html`로 리다이렉트한다(실측). 기본값을 쓴다.
    path: /swagger-ui.html
    # 정본 API 계약(정적 openapi.yaml)을 Swagger UI로 서빙. 코드생성(/v3/api-docs)은 대조·검증용.
    url: /openapi.yaml

op:
  auth:
    # dev-auth 스텁 필터 (D-16). 기본 false — 켜지려면 명시적 설정이 있어야 한다.
    dev-stub: false
    # JWT 쿠키 인증 (D-16 4주차 · ADR-0010). dev-stub=false 일 때만 바인딩된다(JwtAuthConfig).
    jwt:
      # .env 의 JWT_SECRET. ≥32바이트(HS256) — 미달이면 기동 실패시킨다(약한 키로 뜨지 않는다).
      secret: ${JWT_SECRET:}
      access-ttl: PT30M      # 짧게 — 무상태라 폐기가 안 되는 것을 수명으로 상쇄
      refresh-ttl: P14D
      cookie-secure: false   # 🔴 W5 배포(HTTPS) 시 true — 배포 체크리스트 항목
      issuer: openplan
    # 메일 링크 토큰 (ST-B1-04/05). dev 스텁 여부와 무관하게 바인딩된다.
    token:
      # 🔴 두 수명은 명세에 없다 — exceptions.md 는 만료 응답만 정의하고 "몇 시간"이 없다.
      #    팀이 정하면 코드가 아니라 여기만 고친다. 메일 본문의 유효 시간 안내도 이 값에서 나온다.
      email-verification-ttl: PT24H
      password-reset-ttl: PT1H     # 계정 탈취로 직결되므로 인증 링크보다 짧게
      # 재발송 최소 간격 — ui-spec §AUTH "60초 쿨다운 카운트다운"이 정본.
      resend-cooldown: PT60S
  # AI 계획 초안 서비스 (계약 "05. Spring ↔ AI 서비스 REST 계약").
  # 🔴 base-url 이 비어 있으면 AI 접합(AiConfig)이 통째로 안 올라가고 규칙 first-fit 이 그대로
  #    PlanPlacementPort 를 맡는다 — AI 를 안 켠 로컬·CI 가 이것 때문에 멈추지 않는다(D-32).
  # 🔴 배포는 내부망 주소다. nginx 에 라우트를 만들지 않는다 — 브라우저가 AI 를 직접 부르는 경로는
  #    두지 않는다는 것이 계약 §2 다.
  ai:
    base-url: ${AI_BASE_URL:}
    # 초과하면 규칙 폴백. 계약 §7 #2 제안값 — 규칙 예산(NFR-029 5초)보다 긴 것은 의도된 것이다.
    timeout: PT20S

  # 앱 주소 — 메일 링크와 OAuth 리다이렉트가 같은 값을 보게 하는 자리(AppProperties).
  # 🔴 W5 배포 시 둘 다 실도메인으로 교체(cookie-secure: true 와 같은 배포 체크리스트 항목).
  app:
    # 사용자 브라우저가 여는 **프론트 주소**. 메일 링크와 OAuth 성공/실패 후 화면이 여기 붙는다.
    # 기본값은 Vite 개발 서버 기준.
    base-url: ${APP_BASE_URL:http://localhost:5173}
    # **이 서버 주소**. OAuth redirect_uri 가 여기 붙으며, 제공자 콘솔 등록값과 한 글자도 달라선 안 된다
    # (be1-notes: {api-base-url}/api/v1/auth/oauth/{provider}/callback).
    api-base-url: ${API_BASE_URL:http://localhost:8080}
  mail:
    # 발신 주소. 비우면 SMTP 계정을 그대로 쓴다 — 제공자가 인증된 주소만 발신을 허용하기 때문(MailConfig).
    from: ${MAIL_FROM:}
  # 소셜 제공자 자격증명 (be1-notes — 3사 등록 완료 2026-07-18). 비어 있으면 그 제공자만 막힌다.
  oauth:
    clients:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      naver:
        client-id: ${NAVER_CLIENT_ID:}
        client-secret: ${NAVER_CLIENT_SECRET:}
      kakao:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}

logging:
  pattern:
    # traceId(MDC) 동반 — X-Trace-Id 헤더와 대조 (exceptions.md §1)
    level: "%5p [traceId=%X{traceId:-}]"

---
# =====================================================================================
# local (개발) — dev 시드와 dev-auth 스텁을 여는 유일한 프로파일.
# =====================================================================================
spring:
  config:
    activate:
      on-profile: local

  flyway:
    # V1 baseline + R__dev_seed. 시드는 R__(repeatable)이라 파일이 바뀌면 자동 재적용된다.
    locations: classpath:db/migration,classpath:db/migration-dev

op:
  auth:
    dev-stub: true
