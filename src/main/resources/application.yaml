spring:
  application:
    name: openplan-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:openplan}
    username: ${DB_USERNAME:openplan}
    password: ${DB_PASSWORD:openplan1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  # Flyway: global 골격(ST-B1-01)에서 dev 시드/마이그레이션 도입 시 활성화
  flyway:
    enabled: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

# 애플리케이션 설정
op:
  auth:
    # dev-auth 스텁 필터 활성화 (local 개발 한정). 운영 프로파일은 반드시 false로 override — dev 스텁 유출 차단.
    dev-stub: true

logging:
  pattern:
    # traceId(MDC) 동반 — X-Trace-Id 헤더와 대조 (exceptions.md §1)
    level: "%5p [traceId=%X{traceId:-}]"
