services:
  postgres:
    image: postgres:16
    container_name: openplan-postgres
    restart: unless-stopped
    # 호스트 5432에 네이티브 PG가 있을 수 있어 5433으로 매핑(컨테이너 내부는 5432 유지)
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openplan}
      POSTGRES_USER: ${POSTGRES_USER:-openplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openplan1234}
      TZ: Asia/Seoul
    volumes:
      - openplan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openplan} -d ${POSTGRES_DB:-openplan}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openplan-postgres-data:
